<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Michael Benjamin Mocioiu" />
    <meta
      name="description"
      content="A gallery of small, standalone, embeddable web widgets and games by Michael Benjamin Mocioiu."
    />
    <link rel="canonical" href="https://michaelmocioiu.github.io/widget-lib/" />
    <title>Widget Gallery - Michael's Widgets</title>
    <style>
      body {
        background: #0b0d12;
        color: #eee;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding: 1.5rem 1rem 3rem;
        margin: 0;
      }
      header {
        width: 100%;
        max-width: 960px;
        padding: 0.25rem 0;
      }
      header h1 {
        margin: 0 0 0.25rem;
        font-size: 1.4rem;
        font-weight: 700;
      }
      header p {
        margin: 0;
        color: #aaa;
        font-size: 0.9rem;
      }
      .grid {
        width: 100%;
        max-width: 960px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
      }
      .card {
        display: flex;
        flex-direction: column;
        border: 1px solid #2a3040;
        border-radius: 10px;
        overflow: hidden;
        background: #14171e;
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .card:hover {
        border-color: #4a5468;
        transform: translateY(-2px);
      }
      .card-thumb {
        aspect-ratio: 4 / 3;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card-thumb svg {
        width: 60%;
        height: 60%;
      }
      .card-label {
        padding: 0.65rem 0.85rem 0.8rem;
        border-top: 1px solid #2a3040;
      }
      .card-label .title {
        display: block;
        font-weight: 600;
        font-size: 0.95rem;
      }
      .card-label .blurb {
        display: block;
        margin-top: 0.15rem;
        font-size: 0.8rem;
        color: #8891a3;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Widget Gallery</h1>
      <p>By Michael Mocioiu — small, embeddable web widgets and games.</p>
    </header>

    <section class="grid" id="gallery-grid"></section>

    <script>
      // Add an entry here for every widget folder at the repo root -- each
      // becomes one card in the grid, linking to that widget's own page.
      const WIDGETS = [
        {
          name: "snake",
          title: "Snake Duel",
          blurb: "Play solo, vs. AI, or head-to-head",
          thumbBg: "#1a1e27",
          thumb: `<svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6h6a4 4 0 0 1 4 4v4a4 4 0 0 0 4 4h2" />
            <circle cx="20" cy="6" r="2" fill="#4ade80" stroke="none" />
          </svg>`,
        },
        {
          name: "tetr",
          title: "Tetr Versus",
          blurb: "Solo marathon, vs. AI, or local 2-player falling blocks",
          thumbBg: "#1a1e27",
          thumb: `<svg viewBox="0 0 24 24" fill="#31C7EF" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="9" width="5" height="5" rx="1" />
            <rect x="8" y="9" width="5" height="5" rx="1" fill="#F7D308" />
            <rect x="8" y="4" width="5" height="5" rx="1" fill="#AD4D9C" />
            <rect x="13" y="14" width="5" height="5" rx="1" fill="#EF2029" />
          </svg>`,
        },
      ];

      const grid = document.getElementById("gallery-grid");
      for (const w of WIDGETS) {
        const a = document.createElement("a");
        a.className = "card";
        a.href = `${w.name}/`;
        a.innerHTML = `
          <div class="card-thumb" style="background:${w.thumbBg}">${w.thumb}</div>
          <div class="card-label">
            <span class="title">${w.title}</span>
            <span class="blurb">${w.blurb}</span>
          </div>
        `;
        grid.appendChild(a);
      }
    </script>
  </body>
</html>
